<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">2048 game thumbnail</title>
  <desc id="desc">A 2048 puzzle board with numbered tiles and a score panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e8d0"/>
      <stop offset="1" stop-color="#d7c2a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2d2926" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1000" height="600" fill="url(#bg)"/>
  <rect x="135" y="72" width="730" height="456" rx="32" fill="#fffaf3" filter="url(#shadow)"/>
  <rect x="190" y="126" width="360" height="360" rx="26" fill="#bb9f82"/>
  <rect x="598" y="126" width="212" height="96" rx="24" fill="#2d2926"/>
  <text x="640" y="163" fill="#fffaf3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">SCORE</text>
  <text x="640" y="199" fill="#fffaf3" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">4096</text>
  <rect x="598" y="258" width="212" height="228" rx="24" fill="#efe2d0"/>
  <text x="640" y="324" fill="#2d2926" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900">2048</text>
  <text x="640" y="368" fill="#5f574f" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Puzzle Game</text>
  <g font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    <rect x="210" y="146" width="70" height="70" rx="14" fill="#eee4da"/><text x="245" y="191" fill="#776e65">2</text>
    <rect x="300" y="146" width="70" height="70" rx="14" fill="#ede0c8"/><text x="335" y="191" fill="#776e65">4</text>
    <rect x="390" y="146" width="70" height="70" rx="14" fill="#f2b179"/><text x="425" y="191" fill="#fffaf3">8</text>
    <rect x="480" y="146" width="70" height="70" rx="14" fill="#f59563"/><text x="515" y="191" fill="#fffaf3">16</text>
    <rect x="210" y="236" width="70" height="70" rx="14" fill="#f67c5f"/><text x="245" y="281" fill="#fffaf3">32</text>
    <rect x="300" y="236" width="70" height="70" rx="14" fill="#f65e3b"/><text x="335" y="281" fill="#fffaf3">64</text>
    <rect x="390" y="236" width="70" height="70" rx="14" fill="#edcf72"/><text x="425" y="281" fill="#fffaf3">128</text>
    <rect x="480" y="236" width="70" height="70" rx="14" fill="#edcc61"/><text x="515" y="281" fill="#fffaf3">256</text>
    <rect x="210" y="326" width="70" height="70" rx="14" fill="#edc850"/><text x="245" y="371" fill="#fffaf3">512</text>
    <rect x="300" y="326" width="70" height="70" rx="14" fill="#edc53f"/><text x="335" y="371" fill="#fffaf3">1K</text>
    <rect x="390" y="326" width="70" height="70" rx="14" fill="#edc22e"/><text x="425" y="371" fill="#fffaf3">2K</text>
    <rect x="480" y="326" width="70" height="70" rx="14" fill="#3c3a32"/><text x="515" y="371" fill="#fffaf3">4K</text>
